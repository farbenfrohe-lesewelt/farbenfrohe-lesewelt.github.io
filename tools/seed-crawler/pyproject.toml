[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farbenfrohe-seed-crawler"
version = "0.1.0"
description = "Seed crawler for Mention Radar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seed-crawler = "seed_crawler.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed_crawler*"]
